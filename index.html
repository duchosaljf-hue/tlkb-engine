<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moteur TLKB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body style="margin: 0; background-color: #f8fafc; color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [fiches, setFiches] = useState([
                { id: '1', titre: 'Introduction au Moteur TLKB', contenu: 'Structure unifiée pour la gestion des connaissances et des flux de données.' },
                { id: '2', titre: 'Protocole de Sécurité', contenu: 'Isolation des environnements et validation stricte des déploiements.' }
            ]);
            const [searchQuery, setSearchQuery] = useState('');
            const [notification, setNotification] = useState('Système opérationnel.');

            const handleAuth = (e) => {
                e.preventDefault();
                setIsLoggedIn(true);
                setNotification("Authentification réussie.");
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setNotification("Session fermée.");
            };

            const addFiche = () => {
                const nouvelleFiche = {
                    id: Date.now().toString(),
                    titre: `Nouvelle Fiche #${fiches.length + 1}`,
                    contenu: 'Saisissez ici le contenu stratégique de votre fiche...'
                };
                setFiches([nouvelleFiche, ...fiches]);
                setNotification("Fiche ajoutée avec succès.");
            };

            const deleteFiche = (id) => {
                setFiches(fiches.filter(f => f.id !== id));
                setNotification("Fiche supprimée.");
            };

            const filteredFiches = fiches.filter(f => 
                f.titre.toLowerCase().includes(searchQuery.toLowerCase()) || 
                f.contenu.toLowerCase().includes(searchQuery.toLowerCase())
            );

            return (
                <div style={{ minHeight: '100vh', padding: '24px', boxSizing: 'border-box' }}>
                    {notification && (
                        <div style={{ position: 'fixed', top: '20px', right: '20px', backgroundColor: '#4f46e5', color: '#ffffff', padding: '12px 20px', borderRadius: '12px', boxShadow: '0 10px 15px -3px rgba(0,0,0,0.1)', zIndex: 1000, fontSize: '14px', fontWeight: '500' }}>
                            {notification}
                        </div>
                    )}

                    <header style={{ maxWidth: '800px', margin: '0 auto 32px auto', backgroundColor: '#ffffff', padding: '20px 24px', borderRadius: '16px', boxShadow: '0 1px 3px 0 rgba(0,0,0,0.1)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', border: '1px solid #e2e8f0' }}>
                        <div>
                            <h1 style={{ fontSize: '20px', fontWeight: 'bold', margin: '0 0 4px 0', color: '#0f172a' }}>Moteur TLKB</h1>
                            <p style={{ fontSize: '12px', color: '#64748b', margin: 0 }}>Architecture unifiée et souveraine</p>
                        </div>
                        {isLoggedIn && (
                            <button onClick={handleLogout} style={{ backgroundColor: '#fff1f2', color: '#e11d48', border: 'none', padding: '8px 16px', borderRadius: '10px', fontSize: '14px', fontWeight: '600', cursor: 'pointer' }}>
                                Déconnexion
                            </button>
                        )}
                    </header>

                    <main style={{ maxWidth: '800px', margin: '0 auto' }}>
                        {!isLoggedIn ? (
                            <div style={{ backgroundColor: '#ffffff', padding: '32px', borderRadius: '16px', boxShadow: '0 4px 6px -1px rgba(0,0,0,0.05)', maxWidth: '400px', margin: '40px auto', border: '1px solid #e2e8f0' }}>
                                <h2 style={{ fontSize: '22px', fontWeight: 'bold', textAlign: 'center', marginBottom: '24px', color: '#1e293b' }}>Connexion requise</h2>
                                <form onSubmit={handleAuth} style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                                    <div>
                                        <label style={{ display: 'block', fontSize: '11px', fontWeight: '700', color: '#64748b', textTransform: 'uppercase', marginBottom: '6px' }}>E-mail</label>
                                        <input 
                                            type="email" 
                                            required
                                            value={email}
                                            onChange={(e) => setEmail(e.target.value)}
                                            style={{ width: '100%', padding: '12px', borderRadius: '10px', border: '1px solid #cbd5e1', fontSize: '14px', boxSizing: 'border-box', outline: 'none' }}
                                            placeholder="nom@exemple.com"
                                        />
                                    </div>
                                    <div>
                                        <label style={{ display: 'block', fontSize: '11px', fontWeight: '700', color: '#64748b', textTransform: 'uppercase', marginBottom: '6px' }}>Mot de passe</label>
                                        <input 
                                            type="password" 
                                            required
                                            value={password}
                                            onChange={(e) => setPassword(e.target.value)}
                                            style={{ width: '100%', padding: '12px', borderRadius: '10px', border: '1px solid #cbd5e1', fontSize: '14px', boxSizing: 'border-box', outline: 'none' }}
                                            placeholder="••••••••"
                                        />
                                    </div>
                                    <button type="submit" style={{ width: '100%', backgroundColor: '#4f46e5', color: '#ffffff', border: 'none', padding: '12px', borderRadius: '10px', fontWeight: '600', fontSize: '14px', cursor: 'pointer', marginTop: '8px' }}>
                                        Se connecter
                                    </button>
                                </form>
                            </div>
                        ) : (
                            <div>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px', gap: '16px', flexWrap: 'wrap' }}>
                                    <input 
                                        type="text"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        placeholder="Rechercher dans les fiches..."
                                        style={{ flex: '1', minWidth: '240px', padding: '10px 16px', borderRadius: '10px', border: '1px solid #cbd5e1', fontSize: '14px', outline: 'none' }}
                                    />
                                    <button onClick={addFiche} style={{ backgroundColor: '#4f46e5', color: '#ffffff', border: 'none', padding: '10px 20px', borderRadius: '10px', fontWeight: '600', fontSize: '14px', cursor: 'pointer' }}>
                                        + Nouvelle fiche
                                    </button>
                                </div>

                                <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                                    {filteredFiches.length === 0 ? (
                                        <div style={{ backgroundColor: '#ffffff', padding: '40px', borderRadius: '16px', textAlign: 'center', color: '#94a3b8', border: '1px solid #e2e8f0' }}>
                                            Aucune fiche correspondante trouvée.
                                        </div>
                                    ) : (
                                        filteredFiches.map((fiche) => (
                                            <div key={fiche.id} style={{ backgroundColor: '#ffffff', padding: '24px', borderRadius: '16px', boxShadow: '0 1px 3px 0 rgba(0,0,0,0.1)', border: '1px solid #e2e8f0', display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                                                <div>
                                                    <h3 style={{ fontSize: '16px', fontWeight: 'bold', color: '#1e293b', margin: '0 0 8px 0' }}>{fiche.titre}</h3>
                                                    <p style={{ fontSize: '14px', color: '#475569', margin: 0, lineHeight: '1.5' }}>{fiche.contenu}</p>
                                                </div>
                                                <button onClick={() => deleteFiche(fiche.id)} style={{ backgroundColor: '#fff1f2', color: '#e11d48', border: 'none', padding: '6px 12px', borderRadius: '8px', fontSize: '12px', fontWeight: '600', cursor: 'pointer', flexShrink: 0, marginLeft: '16px' }}>
                                                    Supprimer
                                                </button>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
